<h1>Select Mode</h1>
<div class = "btn-list">
  <button (click)="startGame(true)" class="btn btn-two-players">
    MULTIPLAYER
  </button>
  <button (click)="startGame(false)" class="btn btn-two-players">
    SINGLE PLAYER
  </button>
  <button [routerLink]="['info']" class="btn btn-two-players">
    INFORMATION
  </button>
</div>
